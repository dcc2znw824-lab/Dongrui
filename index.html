<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纳指竞猜 · 投资积分</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --green: #00e5a0;
    --red: #ff4d6d;
    --gold: #ffd166;
    --blue: #4d9fff;
    --text: #e8edf5;
    --muted: #6b7a99;
    --font-display: 'Space Mono', monospace;
    --font-body: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 80px;
  }

  /* ── SCREENS ── */
  .screen { width: 100%; max-width: 460px; display: none; flex-direction: column; align-items: center; gap: 20px; }
  .screen.active { display: flex; }

  /* ── HEADER ── */
  .header { text-align: center; margin-bottom: 8px; }
  .header .eyebrow {
    font-family: var(--font-display);
    font-size: 11px; letter-spacing: 3px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 12px;
  }
  .header h1 {
    font-family: var(--font-display);
    font-size: clamp(26px,5vw,44px); font-weight: 700; line-height: 1.1;
  }
  .header h1 .up { color: var(--green); }
  .header h1 .dn { color: var(--red); }

  /* ── AUTH CARD ── */
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    width: 100%;
    position: relative; overflow: hidden;
  }
  .auth-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, var(--blue), var(--green));
  }
  .auth-tabs { display: flex; gap: 0; margin-bottom: 28px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .auth-tab {
    flex: 1; padding: 10px; text-align: center;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: transparent; border: none; color: var(--muted);
    transition: all 0.2s;
  }
  .auth-tab.active { background: var(--surface2); color: var(--text); }

  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: block; letter-spacing: 0.5px; }
  .form-input {
    width: 100%; padding: 12px 14px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: var(--font-body); font-size: 15px;
    outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--blue); }
  .form-input::placeholder { color: var(--muted); }

  /* PIN input */
  .pin-row { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
  .pin-digit {
    width: 52px; height: 56px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-family: var(--font-display); font-size: 22px; font-weight: 700;
    text-align: center; outline: none; transition: border-color 0.2s;
  }
  .pin-digit:focus { border-color: var(--blue); }

  .auth-btn {
    width: 100%; padding: 14px;
    border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--blue), var(--green));
    color: #0a0e1a; font-family: var(--font-body);
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: opacity 0.2s, transform 0.2s; margin-top: 8px;
  }
  .auth-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .auth-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .auth-msg { font-size: 13px; text-align: center; min-height: 18px; margin-top: 4px; }
  .auth-msg.err { color: var(--red); }
  .auth-msg.ok  { color: var(--green); }

  /* ── GAME SCREEN ── */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; margin-bottom: 4px;
  }
  .topbar-user { font-family: var(--font-display); font-size: 12px; color: var(--muted); }
  .topbar-user span { color: var(--text); }
  .logout-btn {
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all 0.2s;
  }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  /* Score card */
  .score-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 22px 28px; text-align: center; width: 100%;
    position: relative; overflow: hidden;
  }
  .score-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, var(--gold), var(--green));
  }
  .score-label { font-family: var(--font-display); font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .score-value { font-family: var(--font-display); font-size: 54px; font-weight: 700; color: var(--gold); line-height: 1; transition: all 0.3s; }
  .score-delta { font-size: 13px; color: var(--muted); margin-top: 6px; font-family: var(--font-display); min-height: 18px; }
  .score-delta.win { color: var(--green); }
  .score-delta.lose { color: var(--red); }

  /* Level bar */
  .level-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .level-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .level-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px;
    font-family: var(--font-display); font-size: 12px; font-weight: 700;
    transition: all 0.4s;
  }
  .level-next { font-size: 11px; color: var(--muted); font-family: var(--font-display); }
  .level-bar-track {
    width: 100%; height: 8px; border-radius: 99px;
    background: var(--surface2); overflow: hidden;
  }
  .level-bar-fill {
    height: 100%; border-radius: 99px;
    transition: width 0.6s cubic-bezier(.4,0,.2,1), background 0.4s;
  }

  /* Market card */
  .market-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 22px; width: 100%;
  }
  .market-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .market-title { font-family: var(--font-display); font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .market-badge {
    font-size: 11px; padding: 3px 10px; border-radius: 20px; font-family: var(--font-display);
  }
  .market-badge.open   { background: rgba(0,229,160,0.15); color: var(--green); }
  .market-badge.closed { background: rgba(107,122,153,0.15); color: var(--muted); }
  .market-badge.betting{ background: rgba(255,209,102,0.15); color: var(--gold); }
  .market-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .market-row:last-of-type { border-bottom: none; }
  .market-row-label { font-size: 13px; color: var(--muted); }
  .market-row-value { font-family: var(--font-display); font-size: 14px; font-weight: 700; }
  .market-row-value.up { color: var(--green); }
  .market-row-value.dn { color: var(--red); }
  .market-row-value.nu { color: var(--text); }
  #ai-insight { font-size: 12px; color: var(--muted); line-height: 1.6; padding-top: 10px; border-top: 1px solid var(--border); margin-top: 8px; min-height: 0; }
  .fetch-btn {
    width: 100%; margin-top: 12px; padding: 10px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); font-family: var(--font-body); font-size: 13px;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .fetch-btn:hover { border-color: var(--blue); color: var(--blue); }
  .fetch-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Bet card */
  .bet-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 22px 22px; width: 100%;
  }
  .bet-title { font-family: var(--font-display); font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 16px; text-align: center; }
  .bet-deadline { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .bet-deadline span { color: var(--gold); font-family: var(--font-display); }

  /* Amount input */
  .amount-row { margin-bottom: 16px; }
  .amount-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
  .amount-label .max-hint { color: var(--gold); }
  .amount-wrap { position: relative; }
  .amount-input {
    width: 100%; padding: 12px 48px 12px 16px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--gold); font-family: var(--font-display); font-size: 22px; font-weight: 700;
    outline: none; transition: border-color 0.2s;
  }
  .amount-input:focus { border-color: var(--gold); }
  .amount-unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none; }
  .quick-amounts { display: flex; gap: 8px; margin-top: 8px; }
  .quick-amt {
    flex: 1; padding: 6px 4px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--muted); font-size: 12px; cursor: pointer;
    text-align: center; transition: all 0.2s;
  }
  .quick-amt:hover { border-color: var(--gold); color: var(--gold); }

  .bet-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .bet-btn {
    padding: 18px 10px; border-radius: 12px; border: 2px solid transparent;
    cursor: pointer; font-family: var(--font-body);
    transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .bet-btn .b-icon { font-size: 26px; }
  .bet-btn .b-label { font-size: 17px; font-weight: 700; }
  .bet-btn .b-hint { font-size: 11px; opacity: 0.65; }
  .bet-btn.up-btn { background: rgba(0,229,160,0.07); border-color: rgba(0,229,160,0.25); color: var(--green); }
  .bet-btn.up-btn:hover, .bet-btn.up-btn.sel { background: rgba(0,229,160,0.16); border-color: var(--green); box-shadow: 0 0 18px rgba(0,229,160,0.18); }
  .bet-btn.dn-btn { background: rgba(255,77,109,0.07); border-color: rgba(255,77,109,0.25); color: var(--red); }
  .bet-btn.dn-btn:hover, .bet-btn.dn-btn.sel { background: rgba(255,77,109,0.16); border-color: var(--red); box-shadow: 0 0 18px rgba(255,77,109,0.18); }
  .bet-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .confirm-btn {
    width: 100%; padding: 15px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--green), var(--blue));
    color: #0a0e1a; font-family: var(--font-body);
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; letter-spacing: 0.5px;
  }
  .confirm-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .confirm-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
  .rules-hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .rules-hint .g { color: var(--green); font-weight: 600; }
  .rules-hint .r { color: var(--red); font-weight: 600; }

  /* Today bet status */
  .today-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 22px; width: 100%; text-align: center;
  }
  .tc-label { font-family: var(--font-display); font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
  .tc-choice { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .tc-choice.up { color: var(--green); }
  .tc-choice.dn { color: var(--red); }
  .tc-amount { font-family: var(--font-display); font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .tc-amount span { color: var(--gold); }
  .tc-time { font-size: 12px; color: var(--muted); font-family: var(--font-display); }
  .tc-result { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .tc-result.win  { background: rgba(0,229,160,0.1); color: var(--green); }
  .tc-result.lose { background: rgba(255,77,109,0.1); color: var(--red); }
  .tc-result.pending { background: rgba(255,209,102,0.1); color: var(--gold); }
  .settle-btn {
    width: 100%; margin-top: 12px; padding: 12px;
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--gold);
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .settle-btn:hover { border-color: var(--gold); }
  .settle-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* History */
  .history-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 22px; width: 100%;
  }
  .history-title { font-family: var(--font-display); font-size: 11px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; }
  .history-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 14px 0; }
  .history-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .history-item:last-child { border-bottom: none; }
  .hi-date  { color: var(--muted); font-family: var(--font-display); font-size: 11px; min-width: 68px; }
  .hi-choice { font-weight: 600; min-width: 52px; }
  .hi-choice.up { color: var(--green); }
  .hi-choice.dn { color: var(--red); }
  .hi-amount { color: var(--muted); font-size: 12px; font-family: var(--font-display); flex:1; }
  .hi-result { font-family: var(--font-display); font-weight: 700; font-size: 13px; }
  .hi-result.win  { color: var(--green); }
  .hi-result.lose { color: var(--red); }
  .hi-result.pending { color: var(--gold); }

  /* Spinner */
  .spin { display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,0.12); border-top-color: var(--blue); border-radius:50%; animation: rot 0.7s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* Modal overlay */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 100;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 24px; width: 100%; max-width: 340px; text-align: center;
  }
  .modal-box h3 { font-family: var(--font-display); font-size: 16px; margin-bottom: 10px; }
  .modal-box p  { font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-cancel {
    flex:1; padding:11px; border-radius:10px; border:1px solid var(--border);
    background:transparent; color:var(--muted); font-size:14px; cursor:pointer;
  }
  .modal-confirm {
    flex:1; padding:11px; border-radius:10px; border:none;
    background: linear-gradient(135deg, var(--green), var(--blue));
    color:#0a0e1a; font-size:14px; font-weight:700; cursor:pointer;
  }
</style>
</head>
<body>

<!-- ══════════ AUTH SCREEN ══════════ -->
<div class="screen active" id="screen-auth">
  <div class="header">
    <div class="eyebrow">纳斯达克100 · 每日竞猜</div>
    <h1>今天<span class="up">涨</span>还是<span class="dn">跌</span>？</h1>
  </div>

  <div class="auth-card" style="max-width:420px;width:100%">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">登录</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">注册</button>
    </div>

    <!-- Login form -->
    <div id="form-login">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input class="form-input" id="login-user" placeholder="输入用户名" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label">四位数字密码</label>
        <div class="pin-row">
          <input class="pin-digit" id="lp0" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
          <input class="pin-digit" id="lp1" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
          <input class="pin-digit" id="lp2" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
          <input class="pin-digit" id="lp3" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
        </div>
      </div>
      <div class="auth-msg" id="login-msg"></div>
      <button class="auth-btn" onclick="doLogin()">登录</button>
    </div>

    <!-- Register form -->
    <div id="form-register" style="display:none">
      <div class="form-group">
        <label class="form-label">设置用户名</label>
        <input class="form-input" id="reg-user" placeholder="2~12位字符" autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="form-label">设置四位数字密码</label>
        <div class="pin-row">
          <input class="pin-digit" id="rp0" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
          <input class="pin-digit" id="rp1" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
          <input class="pin-digit" id="rp2" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
          <input class="pin-digit" id="rp3" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">确认密码</label>
        <div class="pin-row">
          <input class="pin-digit" id="rc0" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
          <input class="pin-digit" id="rc1" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
          <input class="pin-digit" id="rc2" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
          <input class="pin-digit" id="rc3" maxlength="1" inputmode="numeric" pattern="[0-9]" type="password" />
        </div>
      </div>
      <div class="auth-msg" id="reg-msg"></div>
      <button class="auth-btn" onclick="doRegister()">注册并开始游戏</button>
    </div>
  </div>
</div>

<!-- ══════════ GAME SCREEN ══════════ -->
<div class="screen" id="screen-game">

  <!-- Top bar -->
  <div class="topbar" style="max-width:460px;width:100%">
    <div class="topbar-user">玩家 <span id="display-username"></span></div>
    <button class="logout-btn" onclick="doLogout()">退出登录</button>
  </div>

  <!-- Score -->
  <div class="score-card">
    <div class="score-label">💰 投资积分</div>
    <div class="score-value" id="score-display">50</div>
    <div class="score-delta" id="score-delta"></div>
    <div class="level-section">
      <div class="level-header">
        <span class="level-badge" id="level-badge">LV 1</span>
        <span class="level-next" id="level-next">距 LV 2 还差 50 分</span>
      </div>
      <div class="level-bar-track">
        <div class="level-bar-fill" id="level-bar-fill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- Market -->
  <div class="market-card">
    <div class="market-header">
      <div class="market-title">NDX · 纳斯达克100</div>
      <div class="market-badge closed" id="market-status">加载中</div>
    </div>
    <div class="market-row">
      <span class="market-row-label">最近收盘价</span>
      <span class="market-row-value nu" id="ndx-close">—</span>
    </div>
    <div class="market-row">
      <span class="market-row-label">前一日收盘</span>
      <span class="market-row-value nu" id="ndx-prev">—</span>
    </div>
    <div class="market-row">
      <span class="market-row-label">涨跌幅</span>
      <span class="market-row-value nu" id="ndx-change">—</span>
    </div>
    <div class="market-row">
      <span class="market-row-label">数据日期</span>
      <span class="market-row-value nu" id="ndx-date">—</span>
    </div>
    <div id="ai-insight"></div>
    <button class="fetch-btn" id="fetch-btn" onclick="fetchMarketData()">
      <span class="spin" id="fetch-spin" style="display:none"></span>
      <span id="fetch-btn-text">🔄 获取最新行情</span>
    </button>
  </div>

  <!-- Today bet status (shown after bet) -->
  <div class="today-card" id="today-card" style="display:none">
    <div class="tc-label">今日已下注</div>
    <div class="tc-choice" id="tc-choice"></div>
    <div class="tc-amount" id="tc-amount"></div>
    <div class="tc-time"   id="tc-time"></div>
    <div class="tc-result" id="tc-result"></div>
    <button class="settle-btn" id="settle-btn" onclick="settleToday()" style="display:none">📊 结算今日竞猜</button>
  </div>

  <!-- Bet card (hidden after bet) -->
  <div class="bet-card" id="bet-card">
    <div class="bet-title">下注今日收盘方向</div>
    <div class="bet-deadline">美股收盘前 <span id="countdown">计算中…</span> 截止</div>

    <div class="amount-row">
      <div class="amount-label">
        <span>下注积分</span>
        <span class="max-hint" id="max-hint">最多可押 <span id="max-show">—</span></span>
      </div>
      <div class="amount-wrap">
        <input class="amount-input" id="bet-amount" type="number" min="1" placeholder="0" />
        <span class="amount-unit">分</span>
      </div>
      <div class="quick-amounts">
        <button class="quick-amt" onclick="setQuickAmt(0.25)">25%</button>
        <button class="quick-amt" onclick="setQuickAmt(0.5)">50%</button>
        <button class="quick-amt" onclick="setQuickAmt(0.75)">75%</button>
        <button class="quick-amt" onclick="setQuickAmt(1)">全押</button>
      </div>
    </div>

    <div class="bet-buttons">
      <button class="bet-btn up-btn" id="btn-up" onclick="selectBet('up')">
        <span class="b-icon">📈</span>
        <span class="b-label">看涨</span>
        <span class="b-hint">猜对翻倍</span>
      </button>
      <button class="bet-btn dn-btn" id="btn-dn" onclick="selectBet('down')">
        <span class="b-icon">📉</span>
        <span class="b-label">看跌</span>
        <span class="b-hint">猜对翻倍</span>
      </button>
    </div>
    <button class="confirm-btn" id="confirm-btn" onclick="openConfirmModal()" disabled>确认下注</button>
    <div class="rules-hint">猜对 <span class="g">下注积分 ×2</span>，猜错 <span class="r">输光下注积分</span></div>
  </div>

  <!-- History -->
  <div class="history-card">
    <div class="history-title">历史记录</div>
    <div id="history-list"><div class="history-empty">暂无记录</div></div>
  </div>

</div>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-box">
    <h3>确认下注？</h3>
    <p id="modal-desc"></p>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">取消</button>
      <button class="modal-confirm" onclick="confirmBet()">确认</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// STORAGE — per-user data stored under key ndx_u_{username}
// ══════════════════════════════════════════════════════
const USERS_KEY = 'ndx_users_v1';

function loadUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; } catch { return {}; }
}
function saveUsers(u) { localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

function loadUserState(username) {
  const key = 'ndx_u_' + username;
  try {
    const s = JSON.parse(localStorage.getItem(key));
    if (s) return s;
  } catch {}
  return { score: 50, maxScore: 50, level: 1, history: [], todayBet: null };
}
function saveUserState(username, state) {
  localStorage.setItem('ndx_u_' + username, JSON.stringify(state));
}

// ══════════════════════════════════════════════════════
// SESSION
// ══════════════════════════════════════════════════════
let currentUser = null;
let state = null;
let selectedDir = null;
let marketData = null;

// Check if already logged in (session)
function initSession() {
  const s = sessionStorage.getItem('ndx_session');
  if (s) {
    currentUser = s;
    state = loadUserState(currentUser);
    showGame();
  }
}

// ══════════════════════════════════════════════════════
// AUTH UI
// ══════════════════════════════════════════════════════
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
}

function getPin(prefix) {
  return [0,1,2,3].map(i => document.getElementById(prefix+i).value).join('');
}

function doRegister() {
  const username = document.getElementById('reg-user').value.trim();
  const pin = getPin('rp');
  const pinConfirm = getPin('rc');
  const msgEl = document.getElementById('reg-msg');

  if (!username || username.length < 2 || username.length > 12) {
    msgEl.className = 'auth-msg err'; msgEl.textContent = '用户名需2~12位字符'; return;
  }
  if (!/^\d{4}$/.test(pin)) {
    msgEl.className = 'auth-msg err'; msgEl.textContent = '密码需为4位数字'; return;
  }
  if (pin !== pinConfirm) {
    msgEl.className = 'auth-msg err'; msgEl.textContent = '两次密码不一致'; return;
  }

  const users = loadUsers();
  if (users[username]) {
    msgEl.className = 'auth-msg err'; msgEl.textContent = '用户名已存在，请直接登录'; return;
  }

  // Simple hash: store as-is (it's a 4-digit PIN game, not production)
  users[username] = { pin };
  saveUsers(users);

  msgEl.className = 'auth-msg ok'; msgEl.textContent = '注册成功！';
  setTimeout(() => {
    currentUser = username;
    state = loadUserState(currentUser);
    sessionStorage.setItem('ndx_session', currentUser);
    showGame();
  }, 800);
}

function doLogin() {
  const username = document.getElementById('login-user').value.trim();
  const pin = getPin('lp');
  const msgEl = document.getElementById('login-msg');

  if (!username) { msgEl.className='auth-msg err'; msgEl.textContent='请输入用户名'; return; }
  if (!/^\d{4}$/.test(pin)) { msgEl.className='auth-msg err'; msgEl.textContent='请输入4位数字密码'; return; }

  const users = loadUsers();
  if (!users[username]) { msgEl.className='auth-msg err'; msgEl.textContent='用户不存在，请先注册'; return; }
  if (users[username].pin !== pin) { msgEl.className='auth-msg err'; msgEl.textContent='密码错误'; return; }

  currentUser = username;
  state = loadUserState(currentUser);
  sessionStorage.setItem('ndx_session', currentUser);
  showGame();
}

function doLogout() {
  sessionStorage.removeItem('ndx_session');
  currentUser = null; state = null; selectedDir = null; marketData = null;
  document.getElementById('screen-game').classList.remove('active');
  document.getElementById('screen-auth').classList.add('active');
  // clear pin inputs
  ['lp0','lp1','lp2','lp3'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('login-msg').textContent = '';
}

function showGame() {
  // Migrate existing accounts missing maxScore/level
  if (state.maxScore === undefined) state.maxScore = state.score;
  if (state.level === undefined) state.level = Math.floor(state.maxScore / 100) + 1;
  document.getElementById('screen-auth').classList.remove('active');
  document.getElementById('screen-game').classList.add('active');
  document.getElementById('display-username').textContent = currentUser;
  renderScore();
  renderTodayBet();
  renderHistory();
  updateCountdown();
  updateMaxHint();
  fetchMarketData();
}

// ══════════════════════════════════════════════════════
// TIME HELPERS
// ══════════════════════════════════════════════════════
function getTodayNY() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'America/New_York' });
}
function isWithinBettingWindow() {
  const nyNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const day = nyNow.getDay();
  if (day === 0 || day === 6) return { allowed: false, reason: '周末休市' };
  const mins = nyNow.getHours() * 60 + nyNow.getMinutes();
  if (mins < 240)  return { allowed: false, reason: '纽约时间04:00后开放' };
  if (mins >= 960) return { allowed: false, reason: '已过收盘，明日再战' };
  return { allowed: true, reason: '' };
}
function getTimeUntilClose() {
  const nyNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const close = new Date(nyNow); close.setHours(16,0,0,0);
  const diff = close - nyNow;
  if (diff <= 0) return '已收盘';
  const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000);
  return `${h}小时${m}分钟`;
}

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
function renderScore(delta) {
  document.getElementById('score-display').textContent = state.score;
  updateMaxHint();
  renderLevel();
  const el = document.getElementById('score-delta');
  if (delta !== undefined) {
    el.className = 'score-delta ' + (delta > 0 ? 'win' : 'lose');
    el.textContent = delta > 0 ? `▲ +${delta} 积分` : `▼ ${delta} 积分`;
    setTimeout(() => { el.textContent=''; el.className='score-delta'; }, 4000);
  }
}

// Level colours per tier
const LEVEL_COLORS = [
  ['#6b7a99','#4d9fff'],   // LV1  grey→blue
  ['#4d9fff','#00e5a0'],   // LV2  blue→green
  ['#00e5a0','#ffd166'],   // LV3  green→gold
  ['#ffd166','#ff9f43'],   // LV4  gold→orange
  ['#ff9f43','#ff4d6d'],   // LV5  orange→red
  ['#ff4d6d','#c77dff'],   // LV6  red→purple
  ['#c77dff','#e0aaff'],   // LV7+ purple→lavender
];

function getLevelInfo(score) {
  // LV1 = 0–99, LV2 = 100–199, etc.
  const lv = Math.floor(score / 100) + 1;
  const base = (lv - 1) * 100;
  const pct = score >= lv * 100 ? 100 : Math.round(((score - base) / 100) * 100);
  const toNext = lv * 100 - score;
  return { lv, pct, toNext };
}

function renderLevel(levelUp) {
  if (!state) return;
  const { lv, pct, toNext } = getLevelInfo(state.level === undefined ? 1 : state.maxScore || state.score);
  // Use maxScore for level (level never goes down)
  const ms = state.maxScore || state.score;
  const info = getLevelInfo(ms);

  const badge = document.getElementById('level-badge');
  const nextEl = document.getElementById('level-next');
  const fill = document.getElementById('level-bar-fill');

  const ci = Math.min(info.lv - 1, LEVEL_COLORS.length - 1);
  const [c1, c2] = LEVEL_COLORS[ci];

  badge.textContent = `★ LV ${info.lv}`;
  badge.style.background = `linear-gradient(135deg,${c1}22,${c2}33)`;
  badge.style.color = c2;
  badge.style.border = `1px solid ${c2}55`;

  nextEl.textContent = info.toNext > 0
    ? `距 LV ${info.lv + 1} 还差 ${info.toNext} 分`
    : `已达 LV ${info.lv} 顶峰！`;

  fill.style.width = info.pct + '%';
  fill.style.background = `linear-gradient(90deg,${c1},${c2})`;

  if (levelUp) {
    badge.animate([
      {transform:'scale(1)',opacity:1},
      {transform:'scale(1.3)',opacity:0.8},
      {transform:'scale(1)',opacity:1}
    ], {duration:600,easing:'ease-out'});
  }
}

function updateMaxHint() {
  if (!state) return;
  document.getElementById('max-show').textContent = state.score;
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (!state.history.length) { el.innerHTML='<div class="history-empty">暂无记录</div>'; return; }
  el.innerHTML = [...state.history].reverse().slice(0,15).map(h => {
    const rc = h.result==='win'?'win':h.result==='lose'?'lose':'pending';
    const gain = h.result==='win' ? `+${h.amount}` : h.result==='lose' ? `-${h.amount}` : '待结算';
    return `<div class="history-item">
      <span class="hi-date">${h.date}</span>
      <span class="hi-choice ${h.choice==='up'?'up':'dn'}">${h.choice==='up'?'📈涨':'📉跌'}</span>
      <span class="hi-amount">${h.amount}分</span>
      <span class="hi-result ${rc}">${gain}</span>
    </div>`;
  }).join('');
}

function renderTodayBet() {
  const today = getTodayNY();
  const tc = document.getElementById('today-card');
  const bc = document.getElementById('bet-card');

  if (state.todayBet && state.todayBet.date === today) {
    const bet = state.todayBet;
    tc.style.display = 'block'; bc.style.display = 'none';

    const ce = document.getElementById('tc-choice');
    ce.textContent = bet.choice==='up'?'📈 看涨':'📉 看跌';
    ce.className = 'tc-choice '+(bet.choice==='up'?'up':'dn');
    document.getElementById('tc-amount').innerHTML = `下注积分 <span>${bet.amount}</span>`;
    document.getElementById('tc-time').textContent = '下注时间 '+bet.time;

    const re = document.getElementById('tc-result');
    const sb = document.getElementById('settle-btn');
    if (bet.result === 'pending') {
      re.textContent='⏳ 等待收盘结算'; re.className='tc-result pending';
      const w = isWithinBettingWindow();
      sb.style.display = (!w.allowed && w.reason.includes('收盘')) ? 'block' : 'none';
    } else if (bet.result === 'win') {
      re.textContent=`🎉 猜对了！获得 +${bet.amount} 积分`; re.className='tc-result win';
      sb.style.display='none';
    } else {
      re.textContent=`😅 猜错了，损失 ${bet.amount} 积分`; re.className='tc-result lose';
      sb.style.display='none';
    }
  } else {
    tc.style.display='none'; bc.style.display='block';
    const w = isWithinBettingWindow();
    document.getElementById('btn-up').disabled = !w.allowed;
    document.getElementById('btn-dn').disabled = !w.allowed;
    if (!w.allowed) document.getElementById('countdown').textContent = w.reason;
  }
}

function updateCountdown() {
  if (document.getElementById('countdown'))
    document.getElementById('countdown').textContent = getTimeUntilClose();
}

// ══════════════════════════════════════════════════════
// BET LOGIC
// ══════════════════════════════════════════════════════
function setQuickAmt(pct) {
  const v = Math.max(1, Math.floor(state.score * pct));
  document.getElementById('bet-amount').value = v;
  checkConfirmBtn();
}

function selectBet(dir) {
  selectedDir = dir;
  document.getElementById('btn-up').classList.toggle('sel', dir==='up');
  document.getElementById('btn-dn').classList.toggle('sel', dir==='down');
  checkConfirmBtn();
}

function checkConfirmBtn() {
  const amt = parseInt(document.getElementById('bet-amount').value);
  document.getElementById('confirm-btn').disabled = !selectedDir || !(amt >= 1 && amt <= state.score);
}

function openConfirmModal() {
  const amt = parseInt(document.getElementById('bet-amount').value);
  if (!selectedDir || !(amt >= 1 && amt <= state.score)) return;
  const dirText = selectedDir==='up'?'📈 看涨':'📉 看跌';
  document.getElementById('modal-desc').innerHTML =
    `方向：<b>${dirText}</b><br>下注：<b style="color:var(--gold)">${amt} 积分</b><br><br>猜对翻倍得 <b style="color:var(--green)">+${amt}</b>，猜错损失 <b style="color:var(--red)">-${amt}</b>`;
  document.getElementById('confirm-modal').classList.add('show');
}

function closeModal() {
  document.getElementById('confirm-modal').classList.remove('show');
}

function confirmBet() {
  closeModal();
  const amt = parseInt(document.getElementById('bet-amount').value);
  if (!selectedDir || !(amt >= 1 && amt <= state.score)) return;
  const w = isWithinBettingWindow();
  if (!w.allowed) { alert('当前不在下注窗口：'+w.reason); return; }

  const today = getTodayNY();
  const timeStr = new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit'});

  state.todayBet = { date: today, choice: selectedDir, amount: amt, time: timeStr, result: 'pending' };
  state.history = state.history.filter(h => h.date !== today);
  state.history.push({ date: today, choice: selectedDir, amount: amt, result: 'pending' });
  saveUserState(currentUser, state);
  selectedDir = null;
  renderTodayBet(); renderHistory();
}

// ══════════════════════════════════════════════════════
// SETTLEMENT
// ══════════════════════════════════════════════════════
async function settleToday() {
  const btn = document.getElementById('settle-btn');
  btn.disabled = true; btn.textContent = '结算中…';
  await fetchMarketData(true);
  if (!marketData) { btn.disabled=false; btn.textContent='📊 结算今日竞猜'; alert('数据获取失败，请稍后重试'); return; }

  const bet = state.todayBet;
  const actualDir = marketData.change >= 0 ? 'up' : 'down';
  const won = bet.choice === actualDir;
  const delta = won ? bet.amount : -bet.amount;

  state.score += delta;
  state.score = Math.max(0, state.score);
  bet.result = won ? 'win' : 'lose';
  const hi = state.history.find(h => h.date === bet.date);
  if (hi) hi.result = bet.result;

  // Level tracking — level only goes up based on maxScore
  const oldLevel = state.level || 1;
  if (state.score > (state.maxScore || 0)) {
    state.maxScore = state.score;
  }
  state.level = Math.floor((state.maxScore || state.score) / 100) + 1;
  const leveledUp = state.level > oldLevel;

  saveUserState(currentUser, state);
  renderScore(delta);
  if (leveledUp) renderLevel(true);
  renderTodayBet();
  renderHistory();
}

// ══════════════════════════════════════════════════════
// MARKET DATA
// ══════════════════════════════════════════════════════
async function fetchMarketData(silent = false) {
  const btn = document.getElementById('fetch-btn');
  const spin = document.getElementById('fetch-spin');
  const txt  = document.getElementById('fetch-btn-text');
  if (!silent) { btn.disabled=true; spin.style.display='inline-block'; txt.textContent='获取中…'; }

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        tools: [{ type: "web_search_20250305", name: "web_search" }],
        system: `You are a financial data assistant. Search for the LATEST Nasdaq 100 (NDX) index data.
Return ONLY a valid JSON object with no markdown, no backticks, no preamble:
{"date":"YYYY-MM-DD","close":20000.00,"prev_close":19900.00,"change":100.00,"change_pct":0.50,"summary":"中文20字内简述今日走势原因"}`,
        messages: [{ role: "user", content: "Get latest Nasdaq 100 NDX closing price. Return JSON only." }]
      })
    });
    const data = await res.json();
    const raw = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const m = raw.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('no json');
    const p = JSON.parse(m[0]);
    marketData = p;

    const fmt = n => n?.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) || '—';
    document.getElementById('ndx-close').textContent = fmt(p.close);
    document.getElementById('ndx-prev').textContent  = fmt(p.prev_close);

    const chg = p.change||0, pct = p.change_pct||0, sign = chg>=0?'+':'';
    const ce = document.getElementById('ndx-change');
    ce.textContent = `${sign}${chg.toFixed(2)} (${sign}${pct.toFixed(2)}%)`;
    ce.className = 'market-row-value '+(chg>=0?'up':'dn');
    document.getElementById('ndx-date').textContent = p.date||'—';

    const st = document.getElementById('market-status');
    const w = isWithinBettingWindow();
    if (w.allowed) { st.textContent='下注开放'; st.className='market-badge betting'; }
    else { st.textContent='收盘'; st.className='market-badge closed'; }

    if (p.summary) document.getElementById('ai-insight').textContent = '💡 '+p.summary;

  } catch(e) {
    console.error(e);
    if (!silent) document.getElementById('ai-insight').textContent = '⚠️ 数据获取失败，请稍后重试';
  } finally {
    if (!silent) { btn.disabled=false; spin.style.display='none'; txt.textContent='🔄 刷新行情'; }
  }
}

// ══════════════════════════════════════════════════════
// PIN INPUT — auto-advance
// ══════════════════════════════════════════════════════
function setupPinInputs(prefix, count) {
  for (let i = 0; i < count; i++) {
    const el = document.getElementById(prefix + i);
    el.addEventListener('input', e => {
      const v = e.target.value.replace(/\D/g,'');
      e.target.value = v.slice(-1);
      if (v && i < count-1) document.getElementById(prefix+(i+1)).focus();
    });
    el.addEventListener('keydown', e => {
      if (e.key==='Backspace' && !el.value && i>0) document.getElementById(prefix+(i-1)).focus();
    });
  }
}

setupPinInputs('lp', 4);
setupPinInputs('rp', 4);
setupPinInputs('rc', 4);

document.getElementById('bet-amount').addEventListener('input', checkConfirmBtn);

// Enter key on login
document.getElementById('login-user').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

setInterval(updateCountdown, 30000);
setInterval(() => { if(state) renderTodayBet(); }, 60000);

initSession();
</script>
</body>
</html>
